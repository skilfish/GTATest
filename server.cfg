# ===================================================
# 📦 GTATest Server Konfiguration - OX Core Setup
# ===================================================

# Server Grundeinstellungen
sv_hostname "GTATest RP Server"
sv_maxclients 64
sv_enforceGameBuild 2699
sv_licenseKey "DEIN_LIZENZSCHLÜSSEL_HIER"

# Datenbankverbindung
set mysql_connection_string "server=localhost;uid=root;password=root;database=gtatest"

# Logging (Discord Hooks etc.)
setr log_webhook_combat "DEIN_DISCORD_WEBHOOK"
setr log_webhook_admin "DEIN_ADMIN_WEBHOOK"

# Ressourcen-Start
ensure ox_core
ensure ox_lib
ensure ox_target
ensure ox_inventory
ensure oxmysql

# Admin-System
ensure ox_admin
ensure admin_utils

# Charakter & Spawn
ensure illenium-appearance
ensure char_creator
ensure char_multichar
ensure spawn_core

# Logging-Systeme
ensure log_utils
ensure combat_logging

# Konfigurationen
exec permissions.cfg

# Map & Session
ensure map
ensure spawnmanager
ensure sessionmanager